    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        data:
          type: object
          properties:
            id:
              type: string
            content:
              type: string
            senderRole:
              type: string
            createdAt:
              type: string

    MessageListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            messages:
              type: array
              items:
                type: object
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    AttachmentUploadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        data:
          type: object
          properties:
            id:
              type: string
            fileName:
              type: string
            mimeType:
              type: string

    AttachmentListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            attachments:
              type: array
              items:
                type: object

    PrescriptionResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            id:
              type: string
            consultationId:
              type: string
            diagnosis:
              type: string
            medicines:
              type: array
              items:
                type: object

    PaymentInitiateResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 201
        data:
          type: object
          properties:
            id:
              type: string
            amount:
              type: number
            status:
              type: string
              example: 'PENDING'
            gatewayReference:
              type: string

    PaymentStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            id:
              type: string
            amount:
              type: number
            status:
              type: string
              example: 'COMPLETED'

    PaymentReconciliationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          type: object
          properties:
            summary:
              type: object
              properties:
