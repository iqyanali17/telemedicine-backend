name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amrutam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Database Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test?schema=public

      - name: Code Quality & Lint Check
        run: npm run lint

      - name: Execute Automated Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amrutam_test?schema=public
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars-long!
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-minimum-32-chars-long!
          PAYMENT_WEBHOOK_SECRET: ci-test-payment-webhook-secret-32-chars!
          MFA_ENCRYPTION_KEY: ci-test-mfa-encryption-key-32-chars!
          PORT: 5001
          LOG_LEVEL: silent
